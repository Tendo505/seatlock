name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-h2:
    name: Tests (in-memory H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --console=plain
      - name: Show throughput line
        run: grep -h "holds/s" build/test-results/test/*.xml || true

  test-postgres:
    name: Tests (real PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seatlock
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatlock"
          --health-interval 3s
          --health-retries 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/seatlock
      SPRING_DATASOURCE_USERNAME: seatlock
      SPRING_DATASOURCE_PASSWORD: seatlock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --console=plain
      - name: Show throughput line
        run: grep -h "holds/s" build/test-results/test/*.xml || true

  docker:
    name: Docker image builds and serves traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - name: Smoke test against PostgreSQL
        run: |
          set -e
          for i in $(seq 60); do curl -fsS localhost:8080/actuator/health && break; sleep 2; done
          ID=$(curl -fsS -X POST localhost:8080/api/events -H 'Content-Type: application/json' -H 'X-Admin-Key: change-me' \
            -d '{"name":"Smoke","venue":"CI","startsAt":"2099-01-01T00:00:00Z","capacity":1}' | jq -r .id)
          curl -fsS -X POST localhost:8080/api/events/$ID/holds -H 'Content-Type: application/json' -d '{"quantity":1,"email":"ci@example.com"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/events/$ID/holds -H 'Content-Type: application/json' -d '{"quantity":1,"email":"ci@example.com"}')" = 409
      - if: always()
        run: docker compose logs api | tail -50
